version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: rental-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: camera_rental
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - rental-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rental-backend
    restart: always
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/camera_rental
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      PORT: 3000
    volumes:
      - uploads:/app/apps/backend/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rental-net

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: rental-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/app/uploads:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend
    networks:
      - rental-net

volumes:
  db_data:
  uploads:

networks:
  rental-net:
    driver: bridge
